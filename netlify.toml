# Production environment and Stripe webhook cutover validated 2026-08-11.
# Admin v2 route-specific security headers are maintained in public/_headers.
[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NPM_CONFIG_REGISTRY = "https://registry.npmjs.org/"
  NPM_FLAGS = "--omit=dev --no-audit --no-fund"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "frame-ancestors 'self'; object-src 'none'; base-uri 'self'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[redirects]]
  from = "/admin.html"
  to = "/admin/"
  status = 301
  force = true

[[redirects]]
  from = "/visual-editor.html"
  to = "/admin/content/visual-editor"
  status = 301
  force = true

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/campaign/:slug"
  to = "/campaign.html"
  status = 200

[[redirects]]
  from = "/api/checkout"
  to = "/.netlify/functions/create-checkout-session"
  status = 200

[[redirects]]
  from = "/api/redeem/validate"
  to = "/.netlify/functions/validate-give-code"
  status = 200

[[redirects]]
  from = "/api/redeem"
  to = "/.netlify/functions/redeem-give-code"
  status = 200
