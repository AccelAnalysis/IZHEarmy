<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <title>IZHE Army Administration</title>
  <link rel="stylesheet" href="/assets/admin-v2/admin.css">
  <script type="module" src="/assets/admin-v2/app.js"></script>

<body>
  <a class="skip-link" href="#admin-workspace">Skip to administrative workspace</a>
